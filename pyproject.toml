[project]
name = "finance-project"
version = "1.0.0"
description = "Библиотека для работы с финансовыми транзакциями"
authors = [
    {name = "Жанна Иванова", email = "janett_86@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0.0"
]
lint = [
    "black>=23.12.0",
    "isort>=5.13.0",
    "mypy>=1.8.0"
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']

# Добавьте эту секцию
[tool.poetry]
packages = [
    {include = "file_reader.py"},
    {include = "test_file_reader.py"}
]
