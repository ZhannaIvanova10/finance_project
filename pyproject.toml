[tool.coverage.run]
source = ["file_reader"]
omit = ["tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError"
]

[tool.flake8]
max-line-length = 88
exclude = ["__pycache__", ".git", ".venv"]
ignore = "E203, W503"
